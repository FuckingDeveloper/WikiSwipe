services:
  wikiswipe:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wikiswipe
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:/data/dev.db
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env or shell}
    volumes:
      - ./data:/data
